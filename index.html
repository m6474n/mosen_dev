<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Safe placeholder for 'global' and window.fetch getter/setter to prevent sandboxed iframe crashes
      (function() {
        if (typeof window !== 'undefined') {
          var safeHandler = {
            get: function(target, prop) {
              var val = target[prop];
              if (typeof val === 'function') {
                return val.bind(target);
              }
              return val;
            },
            set: function(target, prop, value) {
              if (prop === 'fetch') {
                return true; // Ignore setting fetch to prevent read-only property crash
              }
              try {
                target[prop] = value;
              } catch (e) {
                // Ignore failure on writing read-only properties
              }
              return true;
            }
          };

          try {
            Object.defineProperty(window, 'global', {
              value: new Proxy(window, safeHandler),
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            window.global = window;
          }

          // Also safeguard window.fetch definitions if configurable
          try {
            var originalFetch = window.fetch;
            var mockFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return mockFetch;
              },
              set: function(val) {
                mockFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // Context ignores non-configurable descriptors safely
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
